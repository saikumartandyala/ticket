server {
    listen 80;
    server_name tic.fe-zzz.com;

    # Ticket photo uploads: spec allows up to 5MB per photo, up to 5 photos
    client_max_body_size 10M;

    # Frontend
    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Pass through the scheme nginx-proxy already determined at the edge
        # (it terminates TLS) rather than overwriting with $scheme, which
        # would always read "http" on this internal hop.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # API endpoints
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Pass through the scheme nginx-proxy already determined at the edge
        # (it terminates TLS) rather than overwriting with $scheme, which
        # would always read "http" on this internal hop.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # WebSocket endpoints
    location /api/v1/ws/ {
        proxy_pass http://backend:8000/api/v1/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}
