# Production compose file for LastMinutePass, deployed behind an existing
# shared nginx-proxy (nginxproxy/nginx-proxy) reverse proxy container that
# you already run separately — this file does NOT run its own nginx.
#
# Routing works via nginx-proxy's VIRTUAL_PATH feature: both frontend and
# backend share the same VIRTUAL_HOST (tic.fe-zzz.com), and nginx-proxy
# routes by path prefix between them — frontend gets "/" (the default when
# no VIRTUAL_PATH is set), backend gets VIRTUAL_PATH=/api/, which also
# covers /api/v1/ws/... for the websocket since it's nested under /api/.
#
# All secrets/config come from a root .env file (see .env.example) — nothing
# is hardcoded here.

services:
  postgres:
    image: postgres:16-alpine
    container_name: lastminutepass_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lastminutepass}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-lastminutepass}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: lastminutepass_redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  meilisearch:
    image: getmeili/meilisearch:v1.7
    container_name: lastminutepass_meilisearch
    environment:
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
      - MEILI_ENV=production
    volumes:
      - meili_data:/meili_data
    # No healthcheck: the official image doesn't ship wget/curl, so any
    # HTTP-based check command fails to even execute (not a real health
    # failure) and Compose kills dependent containers waiting on it.
    # Meili starts in well under a second, so a plain "started" dependency
    # (see depends_on below) is sufficient.
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lastminutepass_backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-lastminutepass}
      - REDIS_URL=redis://redis:6379/0
      - MEILISEARCH_URL=http://meilisearch:7700
      - MEILISEARCH_MASTER_KEY=${MEILI_MASTER_KEY}
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_ORIGINS=["https://${DOMAIN}", "http://${DOMAIN}"]
      - FRONTEND_URL=https://${DOMAIN}
      - MSG91_API_KEY=${MSG91_API_KEY:-}
      - MSG91_TEMPLATE_ID=${MSG91_TEMPLATE_ID:-}
      - EMAIL_USER=${EMAIL_USER:-}
      - EMAIL_PASS=${EMAIL_PASS:-}
      - EMAIL_FROM=${EMAIL_FROM:-noreply@tic.fe-zzz.com}
      - EMAIL_FROM_NAME=${EMAIL_FROM_NAME:-LastMinutePass}
      # Picked up by your existing nginx-proxy container — routes this same
      # domain's /api/ (and /api/v1/ws/ under it) to this container.
      - VIRTUAL_HOST=${DOMAIN}
      - VIRTUAL_PORT=8000
      - VIRTUAL_PATH=/api/
      - LETSENCRYPT_HOST=${DOMAIN}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_started
    volumes:
      - backend_uploads:/app/static/uploads
    networks:
      - default
      - nginx-proxy
    restart: unless-stopped

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lastminutepass_celery_worker
    command: celery -A app.workers.celery_app worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-lastminutepass}
      - REDIS_URL=redis://redis:6379/0
      - MEILISEARCH_URL=http://meilisearch:7700
      - MEILISEARCH_MASTER_KEY=${MEILI_MASTER_KEY}
      - SECRET_KEY=${SECRET_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/static/uploads
    restart: unless-stopped

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lastminutepass_celery_beat
    command: celery -A app.workers.celery_app beat --loglevel=info
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-lastminutepass}
      - REDIS_URL=redis://redis:6379/0
      - MEILISEARCH_URL=http://meilisearch:7700
      - MEILISEARCH_MASTER_KEY=${MEILI_MASTER_KEY}
      - SECRET_KEY=${SECRET_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Left empty on purpose: nginx puts frontend+backend on the same
        # origin, so relative /api/v1 paths are correct. Only set these if
        # the API is deliberately split onto a different domain.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-}
    container_name: lastminutepass_frontend
    environment:
      # No VIRTUAL_PATH set — nginx-proxy treats this as the default "/"
      # catch-all for this VIRTUAL_HOST once the backend claims /api/.
      - VIRTUAL_HOST=${DOMAIN}
      - VIRTUAL_PORT=3000
      - LETSENCRYPT_HOST=${DOMAIN}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL:-}
    depends_on:
      - backend
    networks:
      - default
      - nginx-proxy
    restart: unless-stopped

networks:
  default:
  nginx-proxy:
    external: true

volumes:
  postgres_data:
  redis_data:
  meili_data:
  backend_uploads:
